server:
  port: 8081

spring:
  application:
    name: search-orchestrator
  
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      retries: 3
      acks: all
    consumer:
      group-id: search-orchestrator-group
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: "com.search.ai.shared.event,com.search.ai.shared.model"

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
    elasticsearch:
      repositories:
        enabled: true
  
  elasticsearch:
    uris: ${ELASTICSEARCH_URIS:http://localhost:9200}

# Custom Pipeline Configuration
search:
  pipeline:
    timeout-ms: 30000
    topics:
      query-expand: query.expand
      query-expanded: query.expanded
      retrieval-request: retrieval.request
      retrieval-results: retrieval.results
      rank-request: rank.request
      rank-results: rank.results
